<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local RAG</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#1b2433; --muted:#5d6a7e; --line:#d5dbe4;
  --accent:#0f6e6e; --accent-ink:#ffffff; --mark:#ffe98a; --err:#b3261e; --ok:#1d7a46;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141a24; --panel:#1c2431; --ink:#e7ebf2; --muted:#9aa6b8; --line:#2d384a;
        --accent:#4fb8b8; --accent-ink:#0b1a1a; --mark:#5c4f12; --err:#ff8a80; --ok:#6fd49a;}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{display:grid;grid-template-columns:300px 1fr;height:100%;max-width:1180px;margin:0 auto}
aside{padding:24px 20px;border-right:1px solid var(--line);overflow:auto}
h1{font:600 20px/1.2 var(--sans);margin:0 0 4px}
.tag{color:var(--muted);margin:0 0 24px;font-size:13px}
.drop{display:block;padding:22px 14px;border:1.5px dashed var(--line);border-radius:10px;
  text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);color:var(--ink)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop b{color:var(--ink);display:block;margin-bottom:2px}
#docs{list-style:none;margin:16px 0 0;padding:0}
#docs li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;word-break:break-word}
#docs .st{display:block;color:var(--muted);font-size:12px}
.ok{color:var(--ok)!important}.err{color:var(--err)!important}
main{display:flex;flex-direction:column;min-height:0}
#thread{flex:1;overflow:auto;padding:28px clamp(16px,5vw,48px)}
.empty{color:var(--muted);max-width:44ch;margin-top:12vh}
.empty h2{font:400 26px/1.25 var(--serif);color:var(--ink);margin:0 0 8px}
.turn{max-width:68ch;margin:0 0 32px}
.question{font-weight:600;margin:0 0 10px}
.answer{font:17px/1.65 var(--serif);margin:0;white-space:pre-wrap}
.pending{color:var(--muted);font-style:italic}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.src{margin:10px 0 0;padding-left:12px;border-left:3px solid var(--accent)}
.src .f{font-size:12px;color:var(--muted);margin:0 0 4px}
.src .x{margin:0;font:14px/1.55 var(--serif)}
.src mark{background:var(--mark);color:inherit;padding:1px 3px;border-radius:2px}
form{display:flex;gap:10px;padding:14px clamp(16px,5vw,48px) 20px;border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;max-height:160px}
button{font:600 14px var(--sans);background:var(--accent);color:var(--accent-ink);border:0;
  border-radius:8px;padding:0 20px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .tag{margin-bottom:12px}
  #docs{max-height:96px;overflow:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Local RAG</h1>
    <p class="tag">Answers come from your files and run on this machine.</p>
    <label class="drop" id="drop">
      <b>Add documents</b>PDF, TXT or Markdown. Click or drop files here.
      <input type="file" id="file" multiple accept=".pdf,.txt,.md">
    </label>
    <ul id="docs" aria-live="polite"></ul>
  </aside>
  <main>
    <div id="thread" aria-live="polite">
      <div class="empty" id="empty">
        <h2>Ask your documents a question.</h2>
        Add a file on the left, then ask about it below. Each answer lists the passages it was based on.
      </div>
    </div>
    <form id="ask">
      <textarea id="q" rows="1" placeholder="Ask a question about your documents…" aria-label="Question" required></textarea>
      <button id="send" type="submit">Ask</button>
    </form>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const thread = $('#thread'), form = $('#ask'), input = $('#q'), btn = $('#send'),
      docs = $('#docs'), drop = $('#drop'), fileInput = $('#file');

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

async function upload(files){
  for (const f of files){
    const li = el('li'), name = el('span', '', f.name), st = el('span', 'st', 'Reading and indexing…');
    li.append(name, st); docs.prepend(li);
    try {
      const fd = new FormData(); fd.append('file', f);
      const r = await fetch('/api/documents', {method:'POST', body:fd});
      if (!r.ok) throw new Error('server returned ' + r.status);
      st.textContent = 'Ready to search'; st.classList.add('ok');
    } catch (e) {
      st.textContent = 'Could not index (' + e.message + '). Check that Ollama is running.'; st.classList.add('err');
    }
  }
}
fileInput.addEventListener('change', () => { upload([...fileInput.files]); fileInput.value = ''; });
['dragover','dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload([...e.dataTransfer.files]));

function sourceBlock(s){
  const d = el('div', 'src');
  d.append(el('p', 'f', s.file));
  const p = el('p', 'x'), m = el('mark', '', s.excerpt);
  p.append(m); d.append(p);
  return d;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const q = input.value.trim(); if (!q) return;
  input.value = ''; input.style.height = 'auto';
  const empty = $('#empty'); if (empty) empty.remove();
  const turn = el('article', 'turn'), ans = el('p', 'answer pending', 'Searching your documents…');
  turn.append(el('p', 'question', q), ans); thread.append(turn);
  thread.scrollTop = thread.scrollHeight;
  btn.disabled = true;
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})});
    if (!r.ok) throw new Error('server returned ' + r.status);
    const d = await r.json();
    ans.className = 'answer'; ans.textContent = d.answer;
    if (d.sources && d.sources.length){
      const det = el('details'); det.open = true;
      det.append(el('summary', '', 'Based on ' + d.sources.length + ' passage' + (d.sources.length > 1 ? 's' : '')));
      d.sources.forEach(s => det.append(sourceBlock(s)));
      turn.append(det);
    }
  } catch (err) {
    ans.className = 'answer err';
    ans.textContent = 'No answer came back (' + err.message + '). Check that Ollama and the database are running, then ask again.';
  } finally {
    btn.disabled = false; input.focus(); thread.scrollTop = thread.scrollHeight;
  }
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
</script>
</body>
</html>
