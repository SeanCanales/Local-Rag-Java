spring.application.name=DocReaderApp
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

ollama.base-url=http://localhost:11434
ollama.chat-model=llama3.2:3b
ollama.embedding-model=nomic-embed-text

# nomic-embed-text produces 768-dimensional vectors; change this if you change the model
rag.embedding-dimension=768
rag.max-results=4
rag.min-score=0.5

pgvector.host=localhost
pgvector.port=5433
pgvector.database=rag
pgvector.user=rag
pgvector.password=rag
pgvector.table=document_chunks